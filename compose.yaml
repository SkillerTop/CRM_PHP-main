# Client Data CRM: web app (Node.js + React + GPU speech/OCR), scheduler, and optional
# MySQL / HTTPS proxy. Always run with the env file:
#   docker compose --env-file .env.docker [--profile local-db] [--profile https] up -d --build
# See deploy/DOCKER.md.
name: client-data-crm

services:
  # Local MySQL, only with `--profile local-db`. Leave it off to use an existing
  # database server (set DB_HOST/DB_PORT in .env.docker).
  db:
    profiles: ["local-db"]
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.docker}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.docker}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        PADDLE_VERSION: ${PADDLE_VERSION:-3.4.0}
    image: ${CRM_IMAGE:-client-data-crm:latest}
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      WHISPER_PYTHON_BIN: /opt/ai/whisper/bin/python
      WHISPER_SCRIPT: ai/faster_whisper_transcribe.py
      WHISPER_MODEL: ./ai/models/faster-whisper-large-v3-turbo
      WHISPER_MODEL_DIR: storage/whisper-cache
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
      # Business cards: Qwen3-VL in the "ollama" service; the OCR venv only resizes the photo.
      OCR_PYTHON_BIN: /opt/ai/ocr/bin/python
      OCR_SCRIPT: ai/qwen_vl_business_card.py
      OCR_VLM_URL: http://ollama:11434
      OCR_VLM_MODEL: ${OCR_VLM_MODEL:-qwen3-vl:4b-instruct}
    # Published on the host's loopback by default: put a reverse proxy in front
    # (the "https" profile below, or the host's own nginx/Apache).
    ports:
      - "${CRM_BIND:-127.0.0.1}:${CRM_PORT:-8080}:8080"
    volumes:
      # Model weights are not baked into the image (1.7 GB). Point CRM_MODELS_DIR at a
      # directory with faster-whisper-large-v3-turbo/ (Qwen3-VL lives in the ollama-data volume).
      - ${CRM_MODELS_DIR:-./.runtime/models}:/var/www/backend/ai/models:ro
      - app-storage:/var/www/backend/storage
      - ./backend/ai/qwen_vl_business_card.py:/var/www/backend/ai/qwen_vl_business_card.py:ro
      - ./backend/ai/check_runtime.py:/var/www/backend/ai/check_runtime.py:ro
    depends_on:
      db:
        condition: service_healthy
        required: false
      ollama:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Qwen3-VL for business-card OCR. Pull the model once:
  #   docker compose --env-file .env.docker exec ollama ollama pull qwen3-vl:4b-instruct
  ollama:
    image: ollama/ollama:0.40.4
    restart: unless-stopped
    # Host loopback only: a CRM run outside Docker reaches it at 127.0.0.1:11434.
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    environment:
      # Keep the model in VRAM between scans; the first scan after a pause loads it (~10 s).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # One-off OCR check of the repository's code; never touches "app". Put card photos
  # into OCR_TEST_DIR and run:
  #   docker compose --env-file .env.docker --profile ocr-test run --rm ocr-test
  ocr-test:
    profiles: ["ocr-test"]
    image: ${CRM_IMAGE:-client-data-crm:latest}
    entrypoint: ["node", "/var/www/backend-node/dist/ocr-local.js", "/cards"]
    environment:
      OCR_PYTHON_BIN: /opt/ai/ocr/bin/python
      OCR_SCRIPT: /repo/backend/ai/qwen_vl_business_card.py
      OCR_VLM_URL: http://ollama:11434
      OCR_VLM_MODEL: ${OCR_VLM_MODEL:-qwen3-vl:4b-instruct}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-300}
    volumes:
      - ./:/repo:ro
      - ${OCR_TEST_DIR:-./.runtime/ocr-test}:/cards:ro
    depends_on:
      ollama:
        condition: service_started

  # Reminders and cleanup every 15 minutes (replaces the host crontab).
  scheduler:
    image: ${CRM_IMAGE:-client-data-crm:latest}
    restart: unless-stopped
    user: www-data
    env_file: .env.docker
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      RUN_MIGRATIONS: "false"
    volumes:
      - app-storage:/var/www/backend/storage
    depends_on:
      app:
        condition: service_healthy
    command: ["sh", "-c", "while :; do node dist/cli.js reminders:run; node dist/cli.js cleanup; sleep 900; done"]

  # HTTPS with automatic certificates, only with `--profile https`.
  # Requires CRM_DOMAIN pointing at this host and ports 80/443 open.
  proxy:
    profiles: ["https"]
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:-localhost}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?Set PROXY_SHARED_SECRET in .env.docker}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  db-data:
  app-storage:
  ollama-data:
  caddy-data:
  caddy-config:
