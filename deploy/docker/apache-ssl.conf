# HTTPS served by Apache itself; certs come from ./.runtime/ssl mounted at /etc/ssl/crm.
# Self-contained because the image does not enable mod_ssl (ports.conf only listens on 443 when it is).
<IfModule !ssl_module>
    LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so
</IfModule>
Listen 443

<VirtualHost *:443>
    ServerName crm.cjobnikolaev.com
    DocumentRoot /var/www/backend/public
    <Directory /var/www/backend/public>
        AllowOverride All
        Require all granted
    </Directory>
    Timeout 910
    SSLEngine on
    SSLCertificateFile /etc/ssl/crm/fullchain.crt
    SSLCertificateKeyFile /etc/ssl/crm/crm.key
    ErrorLog ${APACHE_LOG_DIR}/crm-error.log
    CustomLog ${APACHE_LOG_DIR}/crm-access.log combined
</VirtualHost>
